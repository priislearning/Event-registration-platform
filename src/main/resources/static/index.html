<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Event Registration Platform</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<div class="sidebar">

    <h2>EVENTIFY</h2>

    <button class="active">
        Users
    </button>

    <button>
        Events
    </button>

    <button>
        Registrations
    </button>

</div>

<div class="main">

    <div class="top">

        <h1>
            Users Dashboard
        </h1>

        <button id="openModal">
            + Add User
        </button>

    </div>

    <table>

        <thead>

        <tr>

            <th>ID</th>
            <th>Name</th>
            <th>Email</th>
            <th></th>

        </tr>

        </thead>

        <tbody id="userTable">

        </tbody>

    </table>

</div>

<div class="modal" id="modal">

    <div class="card">

        <h2>Create User</h2>

        <input
                id="name"
                placeholder="Full Name">

        <input
                id="email"
                placeholder="Email">

        <button id="createBtn">

            Create User

        </button>

    </div>

</div>

<script src="js/app.js"></script>

</body>

</html>
