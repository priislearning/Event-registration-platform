<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Eventify</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<div class="sidebar">

    <div>

        <h2>EVENTIFY</h2>

        <p class="subtitle">
            Admin Dashboard
        </p>

    </div>

    <nav>

        <button class="active">
            Users
        </button>

        <button>
            Events
        </button>

        <button>
            Registrations
        </button>

    </nav>

</div>

<div class="main">

    <div class="top">

        <div>

            <h1>Users Dashboard</h1>

            <p>
                Manage users of your event platform
            </p>

        </div>

        <button id="openModal" class="primary-btn">
            + Add User
        </button>

    </div>

    <!-- Dashboard Cards -->

    <div class="stats">

        <div class="stat-card">

            <span>Total Users</span>

            <h2 id="userCount">
                0
            </h2>

        </div>

        <div class="stat-card">

            <span>Total Events</span>

            <h2 id="eventCount">
                0
            </h2>

        </div>

    </div>

    <!-- Toolbar -->

    <div class="toolbar">

        <input
                type="text"
                id="searchInput"
                placeholder="🔍 Search users...">

    </div>

    <!-- Table -->

    <div class="table-container">

        <table>

            <thead>

            <tr>

                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Actions</th>

            </tr>

            </thead>

            <tbody id="userTable">

            </tbody>

        </table>

    </div>

</div>

<!-- Modal -->

<div class="modal" id="modal">

    <div class="card">

        <div class="modal-header">

            <h2 id="modalTitle">
                Create User
            </h2>

            <button
                    id="closeModal"
                    class="close-btn">

                ✕

            </button>

        </div>

        <input
                id="name"
                placeholder="Enter full name">

        <input
                id="email"
                placeholder="Enter email address">

        <div class="modal-actions">

            <button
                    id="cancelBtn"
                    class="secondary-btn">

                Cancel

            </button>

            <button
                    id="createBtn"
                    class="primary-btn">

                Save User

            </button>

        </div>

    </div>

</div>

<script src="js/app.js"></script>

<script>
    lucide.createIcons();
</script>

</body>

</html>
